<title>같이 읽는 방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
/* Layout: a white room that fills the screen; black line-art characters wander in it. One deliberate light look (white paper, black ink), set in the Haru app's handwriting face. */
@font-face { font-family: 'Ownglyph'; src: url('fonts/Ownglyph_PDH.ttf') format('truetype'); font-weight: 400; font-display: swap; }
:root {
  --paper: #ffffff;
  --ink: #111111;
  --ink-soft: #8d8d89;
  --line: #e4e3df;
  --accent: #c4b6f5;       /* 연보라: 버튼 채움 */
  --accent-ink: #2a2150;   /* 채움 위 글자 */
  --accent-deep: #8b78d9;  /* 선·글자용 보라 */
  --hand: 'Ownglyph', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; }
* { -webkit-tap-highlight-color: transparent; }
.room, .sprite { -webkit-user-select: none; user-select: none; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--hand); font-size: 18px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
body.scroll { overflow: auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .animal-pick:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
body.scroll .app { height: auto; min-height: 100%; padding-block: 0 32px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 6px; }
.brand { font-size: 24px; display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.icons { display: flex; align-items: center; gap: 4px; flex: none; }
.iconbtn { background: none; border: 1.5px solid transparent; border-radius: 999px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
.iconbtn:hover { border-color: var(--line); }
.iconbtn[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.iconbtn.profile { color: var(--ink-soft); margin-left: 2px; }
.iconbtn svg { width: 24px; height: 24px; }

.install-tip { display: flex; align-items: center; gap: 10px; margin-block: 6px 8px; padding: 9px 10px 9px 12px; border: 1.5px solid var(--ink); border-radius: 14px; background: var(--paper); font-size: 15px; line-height: 1.3; }
.install-tip .t { flex: 1; min-width: 0; }
.install-tip .t b { font-weight: 400; color: var(--accent-deep); }
.install-tip .btn { padding: 5px 12px; font-size: 15px; white-space: nowrap; }
.install-tip .x { background: none; border: 0; color: var(--ink-soft); font-size: 16px; padding: 4px 6px; line-height: 1; }
.notice { font-size: 15px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin-block: 6px 4px; }

/* ----- rooms ----- */
.rooms { padding-block: 14px; display: flex; flex-direction: column; gap: 14px; }
.room-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.room-item { display: flex; align-items: stretch; gap: 8px; }
.room-go { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 16px; text-align: left; display: flex; align-items: center; gap: 10px; padding: 14px 14px; color: var(--ink); }
.room-go b { font-weight: 400; font-size: 22px; line-height: 1.2; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-go small { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.06em; }
.room-go .chev { font-size: 22px; color: var(--ink-soft); line-height: 1; }
.room-item .share { width: 52px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--paper); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.room-item .share svg { width: 20px; height: 20px; }
.room-item .share.done { border-color: var(--accent-deep); color: var(--accent-deep); }
.room-item .share.edit { color: var(--ink-soft); }
.room-item .code-row { flex: 1; }
.room-item .code-row input { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 16px; padding: 10px 14px; font-size: 20px; }
.room-item .code-row .btn { padding: 8px 14px; font-size: 17px; white-space: nowrap; }
.room-actions { display: flex; flex-direction: column; gap: 8px; }
.room-btns { display: flex; gap: 8px; }
.room-btns .btn { flex: 1; font-size: 17px; padding: 10px 12px; }
.room-actions .code-row { display: flex; gap: 8px; }
.room-actions .code-row input { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 19px; }
.room-actions .code-row .btn { padding: 8px 14px; font-size: 17px; white-space: nowrap; }
.room-actions .err { color: var(--accent-deep); margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.rooms .hint { color: var(--ink-soft); font-size: 14px; margin: 4px 0 0; }
.roomsbtn { background: none; border: 1.5px solid var(--line); border-radius: 999px; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); padding: 0; margin-right: 6px; vertical-align: middle; }
.roomsbtn svg { width: 18px; height: 18px; }

/* ----- person timeline ----- */
.person { padding-block: 8px 24px; }
.p-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.p-head .back { background: none; border: 1.5px solid var(--line); border-radius: 999px; width: 34px; height: 34px; font-size: 18px; color: var(--ink); padding: 0; }
.p-head .av { width: 44px; height: 48px; }
.p-head .av svg { width: 100%; height: 100%; display: block; }
.p-head .n { font-size: 22px; line-height: 1.15; }
.p-head .n small { font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
.p-head .tot { font-size: 14px; color: var(--ink-soft); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
.tl { position: relative; }
.tl::before { content: ""; position: absolute; left: -20px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
.tl-date { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.tl-card { position: relative; display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--ink); border-radius: 14px; padding: 9px 12px; }
.tl-card.mine { padding-right: 58px; }
.tl-cover { width: 40px; height: 58px; object-fit: cover; border: 1.5px solid var(--ink); border-radius: 2px 4px 4px 2px; flex: none; }
.tl-cover.none { background: var(--accent); display: block; }
.tl-body { min-width: 0; flex: 1; }
.tl-title { font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; }
.tl-title.un { color: var(--ink-soft); }
.tl-note { font-size: 16px; line-height: 1.35; margin-top: 3px; overflow-wrap: anywhere; }
.tl-link { display: block; flex: none; }
.tl-title a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--line); }
.tl-title a:hover { border-bottom-color: var(--accent-deep); }
.tl-title .ext { font-size: 11px; color: var(--ink-soft); margin-left: 3px; vertical-align: top; }
.tl-foot { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.tl-foot .like { display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 9px 2px 7px; color: var(--ink-soft); font-size: 14px; line-height: 1.2; }
.tl-foot .like svg { width: 16px; height: 16px; }
.tl-foot .like.on { border-color: var(--accent-deep); color: var(--accent-deep); }
.tl-foot .like.on svg { fill: var(--accent); }
.tl-foot .like:disabled { opacity: 1; }
.tl-foot .likers { font-size: 13px; color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-card .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--ink-soft); font-size: 16px; line-height: 1; padding: 2px 4px; }
.tl-card .x:hover { color: var(--accent-deep); }
.tl-card .edit { position: absolute; top: 6px; right: 30px; background: none; border: 0; color: var(--ink-soft); padding: 3px 4px; line-height: 1; }
.tl-card .edit svg { width: 15px; height: 15px; display: block; }
.tl-card .edit:hover { color: var(--accent-deep); }
.tl-edit input { display: block; width: 100%; box-sizing: border-box; margin-top: 2px; font: inherit; font-size: 18px; line-height: 1.25; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 9px; background: var(--paper); color: var(--ink); }
.tl-edit textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; font: inherit; font-size: 16px; line-height: 1.35; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 9px; resize: none; background: var(--paper); color: var(--ink); }
.tl-card .cf { margin-top: 6px; font-size: 13px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tl-card .cf button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; font-size: 13px; padding: 1px 9px; color: var(--ink); line-height: 1.4; }
.tl-card .cf button.yes { border-color: var(--accent-deep); color: var(--accent-deep); }
.person .none { color: var(--ink-soft); }
.shelf-card { cursor: pointer; }

/* ----- setup ----- */
.setup { padding-block: 12px; }
.settings .srow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 16px; padding: 10px 14px; margin: 6px 0 22px; color: var(--ink); }
.settings .srow .av { width: 44px; height: 48px; flex: none; }
.settings .srow .av svg { width: 100%; height: 100%; display: block; }
.settings .srow .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.settings .srow .t b { font-weight: 400; font-size: 21px; line-height: 1.2; }
.settings .srow .t small { font-size: 14px; color: var(--ink-soft); }
.settings .srow .chev { font-size: 24px; color: var(--ink-soft); line-height: 1; }
.settings .field { margin-bottom: 22px; }
.settings .hd.code { display: flex; align-items: center; gap: 8px; font-size: 17px; }
.settings .hd.code b { font-weight: 400; letter-spacing: 0.12em; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 10px; font-size: 19px; }
.settings .mini { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; font-size: 14px; padding: 2px 10px; color: var(--ink); }
.settings .note { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
.settings .btn-row { margin-top: 8px; }
.setup h1 { font-weight: 400; font-size: 30px; margin: 8px 0 2px; text-wrap: balance; }
.setup p.lead { color: var(--ink-soft); margin: 0 0 20px; }
.animal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.animal-pick { background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); }
.animal-pick svg { width: 64px; height: 70px; }
.animal-pick span { font-size: 15px; color: var(--ink-soft); }
.animal-pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink) inset; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.field label { font-size: 15px; color: var(--ink-soft); }
.field label i { font-style: normal; color: var(--accent-deep); }
.field input, .field textarea { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; font-size: 19px; }
.field textarea { resize: vertical; min-height: 70px; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 19px; background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.field.push .push-row { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.field.push .push-row b { font-weight: 400; color: var(--accent-deep); }
.field.push .mini { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; font-size: 14px; padding: 2px 10px; color: var(--ink); }
.field.push .note { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
.field.push .note.err { color: var(--accent-deep); }
.field.push .btn.ghost { align-self: flex-start; padding: 7px 14px; font-size: 16px; }
.handoff { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 15px; color: var(--ink-soft); }
.handoff p { margin: 6px 0 0; }
.handoff .hd { color: var(--ink); font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.handoff .hd b { font-weight: 400; letter-spacing: 0.12em; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 10px; font-size: 19px; }
.handoff .mini { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; font-size: 14px; padding: 2px 10px; color: var(--ink); }
.handoff .link { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font-size: 15px; padding: 0; }
.handoff .code-row { display: flex; gap: 8px; margin-top: 6px; }
.handoff .code-row input { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 19px; letter-spacing: 0.1em; }
.handoff .code-row .btn { padding: 8px 14px; font-size: 17px; }
.handoff .err { color: var(--accent-deep); }

/* ----- the room ----- */
.room { position: relative; flex: 1; min-height: 360px; overflow: hidden; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.room-foot { position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 15px; color: var(--ink-soft); pointer-events: none; padding: 0 24px; }
.sprite { position: absolute; left: 0; top: 0; width: 110px; display: flex; flex-direction: column; align-items: center; will-change: transform; --face: 1; --bob: 0px; }
.sprite.offline { opacity: 0.45; filter: grayscale(1); }
.sprite.offline .book { opacity: 0.15; }
.sprite .lamp { position: absolute; top: 12px; right: 22px; width: 9px; height: 9px; border-radius: 50%; background: #4cc96f; box-shadow: 0 0 0 3px rgba(76,201,111,.22), 0 0 10px rgba(76,201,111,.9); animation: lamp 2.2s ease-in-out infinite; }
@keyframes lamp { 0%,100% { box-shadow: 0 0 0 3px rgba(76,201,111,.22), 0 0 8px rgba(76,201,111,.8) } 50% { box-shadow: 0 0 0 5px rgba(76,201,111,.12), 0 0 14px rgba(76,201,111,1) } }
.sprite .book { background: none; border: 0; font-size: 24px; line-height: 1; padding: 6px 14px; border-radius: 999px; filter: grayscale(1); opacity: 0.3; transition: filter .2s, opacity .2s; transform: translateY(var(--bob)); }
.sprite .book.on { filter: none; opacity: 1; }
.sprite .book.mine { cursor: pointer; }
.sprite .book.mine:hover { opacity: 0.75; }
.sprite .book.on.mine:hover { opacity: 1; }
.sprite .book:not(.mine) { cursor: default; }
.sprite .seat { position: relative; width: 78px; height: 86px; }
.sprite .seat .chair { position: absolute; left: -21px; bottom: -6px; width: 120px; height: 75px; color: var(--ink); pointer-events: none; }
.sprite .seat .chair.front { z-index: 2; }
.sprite .seat .feet { position: absolute; left: 9px; bottom: 9px; width: 60px; height: 22px; z-index: 3; pointer-events: none; color: var(--ink); }
.sprite .seat:has(.chair) { margin-bottom: 7px; }   /* the sofa base hangs 6px below the seat box; keep the name clear of it */
.sprite .seat .body { z-index: 1; }
.sprite .body { position: relative; width: 78px; height: 86px; transform: translateY(var(--bob)) scaleX(var(--face)); transform-origin: 50% 100%; }
.sprite .body .glasses { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--ink); }
.sprite.reading .body, .sprite .seat .chair ~ .body { --face: 1; }
.sprite .seat .chair ~ .body { transform: translateY(5px) scale(1, 0.94); transform-origin: 50% 100%; }   /* slightly squat; feet hide behind the seat cushion */
.sprite .body svg { width: 100%; height: 100%; display: block; }
.sprite.reading .body { animation: sway 3.2s ease-in-out infinite; }
.sprite.reading .book { animation: readbook 1.6s ease-in-out infinite; }
.sprite .bookwrap { position: relative; display: inline-block; }
.sprite.reading .dots { position: absolute; bottom: 100%; left: 50%; width: 22px; margin-left: -11px; margin-bottom: -4px; text-align: center; font-size: 13px; line-height: 1; color: var(--ink-soft); animation: drift 2.4s ease-in-out infinite; letter-spacing: 2px; }
@keyframes sway { 0%,100% { transform: translateY(5px) scale(1, 0.94) rotate(-1.5deg) } 50% { transform: translateY(5px) scale(1, 0.94) rotate(1.5deg) } }
@keyframes readbook { 0%,100% { transform: translateY(0) rotate(-6deg) } 50% { transform: translateY(-4px) rotate(6deg) } }
@keyframes drift { 0% { opacity: 0; transform: translateY(6px) } 30% { opacity: 1 } 100% { opacity: 0; transform: translateY(-10px) } }
.sprite .name { font-size: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; line-height: 1.2; }
.sprite .name .me { font-size: 12px; color: var(--ink-soft); margin-left: 3px; }
.sprite .timer { font-size: 17px; letter-spacing: 0.04em; min-height: 22px; line-height: 22px; font-variant-numeric: tabular-nums; }
.sprite .timer.paused { color: var(--ink-soft); }
.sprite .timer.idle { visibility: hidden; }
.sprite .ctrl { display: flex; gap: 5px; margin-top: 3px; }
.sprite .ctrl button { border: 1px solid var(--ink); background: var(--paper); border-radius: 999px; font-size: 14px; padding: 2px 10px; color: var(--ink); line-height: 1.4; }
.sprite .ctrl button.stop { border-color: var(--accent-deep); color: var(--accent-deep); }
.empty { text-align: center; color: var(--ink-soft); padding: 40px 12px; }
.empty b { display: block; font-weight: 400; color: var(--ink); font-size: 22px; margin-bottom: 4px; }
.empty.loading { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; padding: 0; }

/* ----- first-time guide: floats above my book until the first read ----- */
.sprite .guide { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 6px; width: max-content; max-width: 190px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; padding: 6px 11px; font-size: 14px; line-height: 1.3; text-align: center; color: var(--ink); animation: floaty 2.2s ease-in-out infinite; z-index: 7; cursor: pointer; }
.sprite .guide small { font-size: 12px; color: var(--ink-soft); }
.sprite .guide::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 11px; height: 11px; background: var(--paper); border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
@keyframes floaty { 0%,100% { transform: translate(-50%, 0) } 50% { transform: translate(-50%, -6px) } }
@media (prefers-reduced-motion: reduce) { .sprite .guide { animation: none; } }

/* ----- chat ----- */
.chat-fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 50px; height: 50px; border-radius: 999px; border: 0; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; justify-content: center; z-index: 8; box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.chat-fab svg { width: 24px; height: 24px; }

.sh-head .tot { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.shelf { --oak: #d7b27a; --oak-l: #e7cb98; --oak-d: #b08651; --oak-x: #8f6a3a; --back: #f3e6cd; --grain: rgba(104, 66, 22, .13);
  display: flex; flex-wrap: wrap; align-content: flex-start; align-items: flex-start; gap: 12px 5px; padding: 7px 10px 9px; min-height: 58px; max-height: 198px; overflow: hidden; box-sizing: content-box; border-radius: 5px;

    /* top board */
    linear-gradient(var(--oak-l), var(--oak) 60%, var(--oak-d)) left top / 100% 7px no-repeat,
    /* shelf planks: lit top face with streaks, darker front edge */
    repeating-linear-gradient(to bottom, transparent 0 58px, var(--oak-l) 58px 60px, var(--oak) 60px 61px, var(--oak-l) 61px 63px, var(--oak-d) 63px 65px, var(--oak-x) 65px 66px, transparent 66px 70px) 0 7px / 100% 70px repeat-y,
    /* back panel: faint vertical grain over light oak */
    repeating-linear-gradient(90deg, var(--grain) 0 1px, transparent 1px 7px, var(--grain) 7px 8px, transparent 8px 17px) left top / auto auto repeat,

.shelf-card { padding-bottom: 10px; }

.cluster .bub:last-child:not(:first-child) { border-radius: 6px 14px 16px 16px; }

    if (d < 60) continue;

  const all = [...els].map(el => walkerFor(el.dataset.uid, room));
  updateNoGo(room);
  els.forEach((el, i) => {
    const id = el.dataset.uid, w = all[i], r = S.readers.get(id);
    w.x = Math.min(w.x, W); w.y = Math.min(w.y, H); w.tx = Math.min(w.tx, W); w.ty = Math.min(w.ty, H);
    const canWalk = !REDUCED && r && (r.status || 'idle') === 'idle' && (id !== S.me || !S.modal) && isHere(id);
    w.moving = false;
    if (canWalk) {
      if (inNoGo(w.x, w.y) && inNoGo(w.tx, w.ty)) newTarget(w, W, H, all.filter(o => o !== w));   // the box opened over us: walk out
      const dx = w.tx - w.x, dy = w.ty - w.y, d = Math.hypot(dx, dy);
      if (d < 1.5) {
        w.wait -= dt;
        if (w.wait <= 0) { newTarget(w, W, H, all.filter(o => o !== w)); w.wait = 2 + Math.random() * 6; }
      } else {
        const stepLen = Math.min(d, w.speed * dt);
        w.x += dx / d * stepLen; w.y += dy / d * stepLen; w.moving = true;
        if (Math.abs(dx) > 2) w.face = dx < 0 ? -1 : 1;
      }
    } else { w.tx = w.x; w.ty = w.y; }
    // keep characters from overlapping: a walker that gets too close to anyone is nudged away
    if (canWalk) {
      for (const o of all) {
        if (o === w) continue;
        const dx = w.x - o.x, dy = w.y - o.y, d = Math.hypot(dx, dy) || 0.01;
        if (d < MIN_GAP) {
          const push = (MIN_GAP - d) * 0.12;
          w.x = Math.min(W, Math.max(0, w.x + dx / d * push));
          w.y = Math.min(H, Math.max(0, w.y + dy / d * push));
          if (d < MIN_GAP * 0.6) { w.tx = w.x; w.ty = w.y; w.wait = 0.3; }  // too crowded: pick a new spot soon
        }
      }
    }
    el.style.transform = `translate(${w.x.toFixed(1)}px, ${w.y.toFixed(1)}px)`;
    el.style.setProperty('--face', w.face);
    el.style.setProperty('--bob', w.moving ? `${(Math.sin(ts / 110) * 1.8).toFixed(2)}px` : '0px');
  });
}

function groupBooks(list) {
  const groups = new Map();

    g.items.push(sess); g.seconds += sess.seconds || 0; g.latest = Math.max(g.latest, sess.endedAt || 0);
    if (!g.cover && sess.coverUrl) g.cover = sess.coverUrl;
  }
  const out = [...groups.values()];
  out.sort((a, b) => b.latest - a.latest);
  for (const g of out) g.items.sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));
  return out;
}

      <div class="shelf">${books.map(g => `<span class="bk" title="${esc(g.title || '제목 없음')}">${g.cover ? `<img src="${esc(g.cover)}" alt="${esc(g.title)}" loading="lazy">` : `<span class="spine"><span>${esc(g.title || '제목 없음')}</span></span>`}</span>`).join('')}</div>
    </article>`;
  }).join('')}</section>`;
}
function recentTitles() {
  const seen = new Set(), out = [];
  for (const sess of S.sessions.get(S.me) || []) {
    const t = (sess.title || '').trim(); const k = t.toLowerCase();
    if (!t || seen.has(k)) continue;
    seen.add(k); out.push({ title: t, cover: sess.coverUrl || '', isbn: sess.isbn || '' });
    if (out.length >= 8) break;
  }
  return out;
}
function suggestHtml(m) {
  if (m.hits.length) return `<div class="suggest">${m.hits.map((h, i) => `<button type="button" class="hit" data-hit="${i}">${h.thumbnail ? `<img src="${esc(h.thumbnail)}" alt="">` : '<span class="nocover"></span>'}<span class="ht"><b>${esc(h.title)}</b><small>${esc((h.authors || []).join(', '))}${h.publisher ? ' · ' + esc(h.publisher) : ''}</small></span></button>`).join('')}</div>`;
  return m.searching ? `<div class="searching">표지 찾는 중…</div>` : '';
}
// Re-draw only the suggestion box: a full render() while typing resets the input and breaks Korean IME composition.
function renderSuggest() {
  const w = $('.suggest-wrap'); if (!w || !S.modal) return;
  w.innerHTML = suggestHtml(S.modal);
  w.querySelectorAll('[data-hit]').forEach(b => b.addEventListener('click', () => pickHit(+b.dataset.hit)));
}
let searchTimer = null, searchSeq = 0;
// Debounced book lookup shared by the finish sheet and the timeline editor.
function fetchHits(q, onStart, onDone) {
  clearTimeout(searchTimer);
  q = (q || '').trim();
  if (q.length < 1) { searchSeq++; onDone([]); return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    onStart();
    let hits = [];
    try {
      const r = await fetch(BOOK_API + '?q=' + encodeURIComponent(q));
      const data = r.ok ? await r.json() : { hits: [] };
      const seen = new Set();
      hits = (data.hits || []).filter(h => { const k = (h.title || '').trim() + '|' + (h.authors || []).join(','); if (seen.has(k)) return false; seen.add(k); return true; })
        .slice(0, 5).map(h => ({ ...h, thumbnail: (h.thumbnail || '').replace(/^http:/, 'https:') }));
    } catch (e) {}
    if (seq !== searchSeq) return;
    onDone(hits);
  }, 350);
}
function searchBooks(q) {
  if (!S.modal) return;
  fetchHits(q, () => { if (S.modal) { S.modal.searching = true; renderSuggest(); } }, hits => { if (S.modal) { S.modal.hits = hits; S.modal.searching = false; renderSuggest(); } });
}
// Any other render (friend status, poll) waits until the IME composition ends.
document.addEventListener('compositionstart', () => { S.composing = true; });
document.addEventListener('compositionend', () => { S.composing = false; if (S.renderPending) { S.renderPending = false; render(); } });
function pickHit(i) {
  const m = S.modal; const h = m && m.hits[i]; if (!h) return;
  m.title = h.title; m.cover = h.thumbnail || ''; m.isbn = h.isbn || ''; m.hits = []; m.searching = false; m.err = '';
  const ti = $('#s-title'); if (ti) ti.value = h.title;
  render(); setTimeout(() => $('#s-note')?.focus(), 30);
}
function renderModal() {
  const m = S.modal, record = m.mode === 'record';
  return `<div class="overlay" id="overlay">
    <form class="sheet" id="finish-form">
      ${record ? `<h3>책을 기록해요</h3>
      <div class="sum">타이머 없이 책장에 바로 올려요. 무슨 책인가요?</div>` : `<h3>잘 읽었어요</h3>
      <div class="sum">이번에 <b>${fmtClock(m.seconds * 1000)}</b> 읽었어요. 무슨 책이었나요?</div>`}
      <div class="field"><label for="s-title">책 제목 ${record ? '<i>*</i>' : '<span class="opt">(안 적으면 시간만 남아요)</span>'}</label>
        <div class="title-row">${m.cover ? `<img class="cover-sm" src="${esc(m.cover)}" alt="">` : ''}<input id="s-title" maxlength="80" placeholder="제목을 적으면 표지를 찾아줘요" value="${esc(m.title)}" ${record ? 'required' : ''} autocomplete="off"></div>
        <div class="suggest-wrap">${suggestHtml(m)}</div>
        ${recentTitles().length ? `<div class="chips" aria-label="전에 적은 제목">${recentTitles().map(t => `<button type="button" class="chip ${m.title.trim() === t.title ? 'on' : ''}" data-title="${esc(t.title)}" data-cover="${esc(t.cover)}" data-isbn="${esc(t.isbn || '')}">${esc(t.title)}</button>`).join('')}</div>` : ''}
      </div>
      <div class="field"><label for="s-note">한 줄 소감 <span style="color:var(--ink-soft)">(건너뛰어도 돼요)</span></label><textarea id="s-note" maxlength="300" placeholder="오늘 읽으면서 든 생각 한 줄">${esc(m.note)}</textarea></div>
      ${m.err ? `<div class="err">${esc(m.err)}</div>` : ''}
      <div class="btn-row">
        ${record ? `<button type="button" class="btn ghost" id="finish-cancel" ${m.saving ? 'disabled' : ''}>취소</button>` : `<button type="button" class="btn ghost" id="finish-discard" ${m.saving ? 'disabled' : ''}>기록 없이 닫기</button>`}
        <button type="submit" class="btn primary" id="finish-save" ${m.saving ? 'disabled' : ''}>${m.saving ? '저장하는 중…' : (record ? '책장에 올리기' : '저장')}</button>
      </div>
      ${record ? '' : `<div class="again"><button type="button" id="finish-cancel" ${m.saving ? 'disabled' : ''}>아직 다 안 읽었어요, 계속 읽기</button></div>`}
    </form>
  </div>`;
}
function bind() {
  const app = $('#app');
  app.querySelectorAll('.animal-pick').forEach(b => b.addEventListener('click', () => { S.setupAnimal = b.dataset.animal; render(); }));
  $('#setup-save')?.addEventListener('click', saveProfile);
  $('#tip-close')?.addEventListener('click', dismissInstallTip);
  $('#tip-install')?.addEventListener('click', async () => { const p = S.installPrompt; if (!p) return dismissInstallTip(); try { p.prompt(); const r = await p.userChoice; if (r && r.outcome === 'accepted') dismissInstallTip(); } catch (e) {} });
  $('#go-rooms')?.addEventListener('click', () => { const u = new URL(location.href); u.search = ''; location.href = u.toString(); });
  app.querySelectorAll('[data-room]').forEach(b => b.addEventListener('click', () => gotoRoom(b.dataset.room)));
  app.querySelectorAll('[data-copy-room]').forEach(b => b.addEventListener('click', async () => { const link = roomLink(b.dataset.copyRoom); const name = rememberedRooms().find(r => r.id === b.dataset.copyRoom)?.name || '같이 읽는 방'; try { if (navigator.share) { await navigator.share({ title: name, text: name + '에서 같이 읽어요', url: link }); return; } } catch (e) { if (e && e.name === 'AbortError') return; } try { await navigator.clipboard.writeText(link); b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 1500); } catch (e) { S.roomsUi.err = link; render(); } }));
  app.querySelectorAll('[data-rename-room]').forEach(b => b.addEventListener('click', () => { S.roomsUi.mode = 'rename'; S.roomsUi.renameId = b.dataset.renameRoom; S.roomsUi.err = ''; render(); setTimeout(() => { const i = $('#room-rename'); if (i) { i.focus(); i.select(); } }, 30); }));
  $('#room-rename-save')?.addEventListener('click', renameRoom);
  $('#room-rename-cancel')?.addEventListener('click', () => { S.roomsUi.mode = ''; S.roomsUi.renameId = ''; S.roomsUi.err = ''; render(); });
  $('#room-rename')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); renameRoom(); } });
  $('#room-new')?.addEventListener('click', () => { S.roomsUi.mode = 'create'; S.roomsUi.err = ''; render(); setTimeout(() => $('#room-name')?.focus(), 30); });
  $('#room-join-open')?.addEventListener('click', () => { S.roomsUi.mode = 'join'; S.roomsUi.err = ''; render(); setTimeout(() => $('#room-code')?.focus(), 30); });
  $('#room-create')?.addEventListener('click', createRoom);
  $('#room-name')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); createRoom(); } });
  $('#room-join')?.addEventListener('click', joinRoom);
  $('#room-code')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); joinRoom(); } });
  $('#push-on')?.addEventListener('click', enablePush);
  $('#push-off')?.addEventListener('click', disablePush);
  $('#nick')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveProfile(); } });
  app.querySelectorAll('[data-skin]').forEach(b => b.addEventListener('click', () => { S.skin = b.dataset.skin === 'soft' ? 'soft' : 'line'; try { localStorage.setItem('rr.skin', S.skin); } catch (e) {} document.body.classList.toggle('skin-soft', S.skin === 'soft'); render(); }));
  $('#setup-cancel')?.addEventListener('click', () => { S.phase = myReader() ? 'settings' : 'app'; render(); });
  $('#settings-home')?.addEventListener('click', () => { S.phase = 'app'; render(); });
  $('#go-profile')?.addEventListener('click', () => { S.setupAnimal = myReader()?.animal || null; S.phase = 'setup'; render(); });
  $('#copy-code')?.addEventListener('click', async () => { const code = myCode(); try { await navigator.clipboard.writeText(code); $('#copy-code').textContent = '복사됨'; } catch (e) { const r = document.createRange(); r.selectNodeContents($('#my-code')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } });
  $('#handoff-open')?.addEventListener('click', () => { S.handoff.open = true; render(); setTimeout(() => $('#handoff-code')?.focus(), 30); });
  $('#handoff-code')?.addEventListener('input', e => { S.handoff.code = e.target.value; });
  $('#handoff-code')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adoptCode(); } });
  $('#handoff-go')?.addEventListener('click', adoptCode);
  $('#guide')?.addEventListener('click', () => { setGuideDone(); render(); });
  $('#chat-open')?.addEventListener('click', () => { S.chat.open = true; render(); setTimeout(() => $('#chat-input')?.focus(), 30); });
  $('#chat-close')?.addEventListener('click', () => { S.chat.open = false; render(); });
  $('#chat-form')?.addEventListener('submit', e => { e.preventDefault(); sendChat(); });
  const box = $('#chat-box'); if (box) box.scrollTop = box.scrollHeight;
  $('#edit-profile')?.addEventListener('click', () => { S.setupAnimal = myReader()?.animal || null; S.phase = myReader() ? 'settings' : 'setup'; render(); });
  app.querySelectorAll('[data-tab]').forEach(t => t.addEventListener('click', () => { S.tab = t.dataset.tab; S.person = null; render(); }));
  app.querySelectorAll('[data-book="1"]').forEach(b => b.addEventListener('click', () => {
    const r = myReader(); if (!r) return;
    if (r.status === 'idle') startReading(); else stopReading();
  }));
  app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => ({ pause: pauseReading, resume: resumeReading, stop: stopReading })[b.dataset.act]()));
  app.querySelectorAll('[data-person]').forEach(c => { const open = () => { S.person = c.dataset.person; S.confirmDel = null; render(); window.scrollTo(0, 0); }; c.addEventListener('click', open); c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }); });
  $('#person-back')?.addEventListener('click', () => { S.person = null; S.confirmDel = null; S.editNote = null; render(); });
  $('#finish-form')?.addEventListener('submit', e => { e.preventDefault(); finishSession(); });
  $('#record-open')?.addEventListener('click', openRecord);
  $('#alive-yes')?.addEventListener('click', confirmAlive);
  $('#alive-paused')?.addEventListener('click', () => { S.alive.autoPaused = false; render(); });
  $('#finish-cancel')?.addEventListener('click', cancelStop);
  $('#finish-discard')?.addEventListener('click', discardSession);
  app.querySelectorAll('[data-title]').forEach(b => b.addEventListener('click', () => { if (!S.modal) return; S.modal.title = b.dataset.title; S.modal.cover = b.dataset.cover || ''; S.modal.isbn = b.dataset.isbn || ''; S.modal.hits = []; S.modal.err = ''; const ti = $('#s-title'); if (ti) ti.value = b.dataset.title; render(); setTimeout(() => $('#s-note')?.focus(), 30); }));
  $('#s-title')?.addEventListener('input', e => { if (S.modal) { S.modal.title = e.target.value; S.modal.cover = ''; S.modal.isbn = ''; if (S.modal.err && e.target.value.trim()) { S.modal.err = ''; $('.sheet .err')?.remove(); } searchBooks(e.target.value); } });
  app.querySelectorAll('[data-hit]').forEach(b => b.addEventListener('click', () => pickHit(+b.dataset.hit)));
  $('#s-note')?.addEventListener('input', e => { if (S.modal) S.modal.note = e.target.value; });
  app.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { S.confirmDel = b.dataset.del; S.editNote = null; render(); }));
  app.querySelectorAll('[data-like]:not([disabled])').forEach(b => b.addEventListener('click', () => toggleLike(b.dataset.like)));
  app.querySelectorAll('[data-edit-note]').forEach(b => b.addEventListener('click', () => { const sess = (S.sessions.get(S.me) || []).find(x => x.id === b.dataset.editNote); if (!sess) return; S.editNote = sess.id; S.editTitle = sess.title || ''; S.editNoteText = sess.note || ''; S.editCover = null; S.editHits = []; S.editSearching = false; S.confirmDel = null; render(); setTimeout(() => { const t = $('#note-edit'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 30); }));
  $('#title-edit')?.addEventListener('input', e => { S.editTitle = e.target.value; S.editCover = null; editSearch(e.target.value); });
  $('#title-edit')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#note-edit')?.focus(); } });
  $('#note-edit')?.addEventListener('input', e => { S.editNoteText = e.target.value; });
  if (S.editNote) renderEditSuggest();
  $('#note-save')?.addEventListener('click', () => saveNote(S.editNote));
  $('#note-cancel')?.addEventListener('click', () => { S.editNote = null; S.editHits = []; S.editCover = null; searchSeq++; render(); });
  $('#note-edit')?.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(S.editNote); } });
  app.querySelectorAll('[data-del-no]').forEach(b => b.addEventListener('click', () => { S.confirmDel = null; render(); }));
  app.querySelectorAll('[data-del-yes]').forEach(b => b.addEventListener('click', () => deleteSession(b.dataset.delYes)));
  if (S.modal && !S.modal.title && !document.activeElement?.id) setTimeout(() => $('#s-title')?.focus(), 50);
  const room = $('#room');
  if (room) room.querySelectorAll('.sprite').forEach(el => { const w = walkerFor(el.dataset.uid, room); el.style.transform = `translate(${w.x}px, ${w.y}px)`; el.style.setProperty('--face', w.face); });
}
function tick() {
  if (S.phase !== 'app' || S.tab !== 'now') return;
  const now = Date.now();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const r = S.readers.get(el.dataset.timer);
    if (!r || r.status === 'idle') return;
    el.textContent = fmtClock(elapsedOf(r, now));
  });
}

boot();
})();
</script>
