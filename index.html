<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>같이 읽는 방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
/* Layout: a white room that fills the screen; black line-art characters wander in it. One deliberate light look (white paper, black ink), set in the Haru app's handwriting face. */
@font-face { font-family: 'Ownglyph'; src: url('fonts/Ownglyph_PDH.ttf') format('truetype'); font-weight: 400; font-display: swap; }
:root {
  --paper: #ffffff;
  --ink: #111111;
  --ink-soft: #8d8d89;
  --line: #e4e3df;
  --accent: #c4b6f5;       /* 연보라: 버튼 채움 */
  --accent-ink: #2a2150;   /* 채움 위 글자 */
  --accent-deep: #8b78d9;  /* 선·글자용 보라 */
  --hand: 'Ownglyph', 'Gowun Dodum', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--hand); font-size: 18px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
body.scroll { overflow: auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .animal-pick:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
body.scroll .app { height: auto; min-height: 100%; padding-block: 0 32px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px 6px; }
.brand { font-size: 24px; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand small { font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
.icons { display: flex; align-items: center; gap: 6px; }
.iconbtn { background: none; border: 1.5px solid transparent; border-radius: 999px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
.iconbtn:hover { border-color: var(--line); }
.iconbtn[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.iconbtn.profile { color: var(--ink-soft); margin-left: 4px; }
.iconbtn svg { width: 18px; height: 18px; }

.notice { font-size: 15px; color: var(--ink-soft); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; margin-block: 6px 4px; }

/* ----- setup ----- */
.setup { padding-block: 12px; }
.setup h1 { font-weight: 400; font-size: 30px; margin: 8px 0 2px; text-wrap: balance; }
.setup p.lead { color: var(--ink-soft); margin: 0 0 20px; }
.animal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.animal-pick { background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 6px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink); }
.animal-pick svg { width: 64px; height: 70px; }
.animal-pick span { font-size: 15px; color: var(--ink-soft); }
.animal-pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink) inset; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.field label { font-size: 15px; color: var(--ink-soft); }
.field label i { font-style: normal; color: var(--accent-deep); }
.field input, .field textarea { background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; font-size: 19px; }
.field textarea { resize: vertical; min-height: 70px; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 19px; background: var(--ink); color: var(--paper); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--line); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.handoff { margin-top: 22px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 15px; color: var(--ink-soft); }
.handoff p { margin: 6px 0 0; }
.handoff .hd { color: var(--ink); font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.handoff .hd b { font-weight: 400; letter-spacing: 0.12em; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 1px 10px; font-size: 19px; }
.handoff .mini { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; font-size: 14px; padding: 2px 10px; color: var(--ink); }
.handoff .link { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font-size: 15px; padding: 0; }
.handoff .code-row { display: flex; gap: 8px; margin-top: 6px; }
.handoff .code-row input { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 19px; letter-spacing: 0.1em; }
.handoff .code-row .btn { padding: 8px 14px; font-size: 17px; }
.handoff .err { color: var(--accent-deep); }

/* ----- the room ----- */
.room { position: relative; flex: 1; min-height: 360px; overflow: hidden; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.room-foot { position: absolute; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 15px; color: var(--ink-soft); pointer-events: none; padding: 0 24px; }
.sprite { position: absolute; left: 0; top: 0; width: 110px; display: flex; flex-direction: column; align-items: center; will-change: transform; --face: 1; --bob: 0px; }
.sprite.offline { opacity: 0.45; filter: grayscale(1); }
.sprite.offline .book { opacity: 0.15; }
.sprite .lamp { position: absolute; top: 12px; right: 22px; width: 9px; height: 9px; border-radius: 50%; background: #4cc96f; box-shadow: 0 0 0 3px rgba(76,201,111,.22), 0 0 10px rgba(76,201,111,.9); animation: lamp 2.2s ease-in-out infinite; }
@keyframes lamp { 0%,100% { box-shadow: 0 0 0 3px rgba(76,201,111,.22), 0 0 8px rgba(76,201,111,.8) } 50% { box-shadow: 0 0 0 5px rgba(76,201,111,.12), 0 0 14px rgba(76,201,111,1) } }
.sprite .book { background: none; border: 0; font-size: 24px; line-height: 1; padding: 6px 14px; border-radius: 999px; filter: grayscale(1); opacity: 0.3; transition: filter .2s, opacity .2s; transform: translateY(var(--bob)); }
.sprite .book.on { filter: none; opacity: 1; }
.sprite .book.mine { cursor: pointer; }
.sprite .book.mine:hover { opacity: 0.75; }
.sprite .book.on.mine:hover { opacity: 1; }
.sprite .book:not(.mine) { cursor: default; }
.sprite .body { width: 78px; height: 86px; transform: translateY(var(--bob)) scaleX(var(--face)); transform-origin: 50% 100%; }
.sprite .body svg { width: 100%; height: 100%; display: block; }
.sprite.reading .body { animation: sway 3.2s ease-in-out infinite; }
.sprite.reading .book { animation: readbook 1.6s ease-in-out infinite; }
.sprite.reading .dots { position: absolute; top: 0; left: 50%; margin-left: 24px; font-size: 13px; color: var(--ink-soft); animation: drift 2.4s ease-in-out infinite; letter-spacing: 2px; }
@keyframes sway { 0%,100% { transform: rotate(-2.5deg) scaleX(var(--face)) } 50% { transform: rotate(2.5deg) scaleX(var(--face)) } }
@keyframes readbook { 0%,100% { transform: translateY(0) rotate(-6deg) } 50% { transform: translateY(-4px) rotate(6deg) } }
@keyframes drift { 0% { opacity: 0; transform: translateY(6px) } 30% { opacity: 1 } 100% { opacity: 0; transform: translateY(-10px) } }
.sprite .name { font-size: 17px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; line-height: 1.2; }
.sprite .name .me { font-size: 12px; color: var(--ink-soft); margin-left: 3px; }
.sprite .timer { font-size: 17px; letter-spacing: 0.04em; min-height: 22px; line-height: 22px; font-variant-numeric: tabular-nums; }
.sprite .timer.paused { color: var(--ink-soft); }
.sprite .timer.idle { visibility: hidden; }
.sprite .ctrl { display: flex; gap: 5px; margin-top: 3px; }
.sprite .ctrl button { border: 1px solid var(--ink); background: var(--paper); border-radius: 999px; font-size: 14px; padding: 2px 10px; color: var(--ink); line-height: 1.4; }
.sprite .ctrl button.stop { border-color: var(--accent-deep); color: var(--accent-deep); }
.empty { text-align: center; color: var(--ink-soft); padding: 40px 12px; }
.empty b { display: block; font-weight: 400; color: var(--ink); font-size: 22px; margin-bottom: 4px; }

/* ----- first-time guide: floats above my book until the first read ----- */
.sprite .guide { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 6px; width: max-content; max-width: 190px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; padding: 6px 11px; font-size: 14px; line-height: 1.3; text-align: center; color: var(--ink); animation: floaty 2.2s ease-in-out infinite; z-index: 7; cursor: pointer; }
.sprite .guide small { font-size: 12px; color: var(--ink-soft); }
.sprite .guide::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 11px; height: 11px; background: var(--paper); border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
@keyframes floaty { 0%,100% { transform: translate(-50%, 0) } 50% { transform: translate(-50%, -6px) } }
@media (prefers-reduced-motion: reduce) { .sprite .guide { animation: none; } }

/* ----- chat ----- */
.chat-fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 50px; height: 50px; border-radius: 999px; border: 0; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; justify-content: center; z-index: 8; box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.chat-fab svg { width: 24px; height: 24px; }
.chat-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; align-items: center; gap: 8px; background: var(--paper); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.chat-bar input { flex: 1; min-width: 0; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 14px; font-size: 18px; }
.chat-bar .send { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.chat-bar .send svg { width: 20px; height: 20px; }
.chat-bar .close { background: none; border: 0; color: var(--ink-soft); font-size: 16px; padding: 6px; }
.chat-box { position: absolute; top: 6px; right: max(12px, env(safe-area-inset-right, 0px)); width: min(56%, 260px); max-height: 38%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; padding: 4px 0; z-index: 6; }
.msg { display: flex; align-items: baseline; gap: 6px; padding: 4px 10px; font-size: 15px; line-height: 1.3; animation: msgin .25s ease-out; }
.msg b { font-weight: 400; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
.msg span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.msg time { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.msg.mine span { color: var(--accent-deep); }
@keyframes msgin { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

/* ----- records ----- */
.log { padding-block: 8px 24px; display: flex; flex-direction: column; gap: 22px; }
.rec { display: grid; grid-template-columns: 56px 1fr; column-gap: 10px; min-width: 0; }
.rec .av { width: 56px; height: 60px; }
.rec .av svg { width: 100%; height: 100%; display: block; }
.rec .who { display: flex; align-items: baseline; gap: 8px; min-width: 0; margin-bottom: 6px; }
.rec .who .n { font-size: 20px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .who .n small { font-size: 12px; color: var(--ink-soft); margin-left: 3px; }
.rec .who .tot { font-size: 14px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rec .col { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rec .none { font-size: 14px; color: var(--ink-soft); padding-top: 4px; }
.bub { position: relative; border: 1.5px solid var(--ink); border-radius: 16px; padding: 9px 12px 9px; min-width: 0; background: var(--paper); }
.bub::before { content: ""; position: absolute; left: -9px; top: 16px; width: 12px; height: 12px; background: var(--paper); border-left: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: rotate(45deg); }
.bub .top { display: flex; align-items: baseline; gap: 8px; }
.bub .top .t { font-size: 18px; line-height: 1.25; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.bub .top .t.un { color: var(--ink-soft); }
.bub .top .t.un { color: var(--ink-soft); }
.bub .blank { font-size: 14px; color: var(--ink-soft); }
.bub .note { font-size: 16.5px; line-height: 1.35; overflow-wrap: anywhere; margin-top: 2px; }
.cluster { display: flex; flex-direction: column; gap: 3px; }
.cluster .bub:not(:first-child)::before { display: none; }
.cluster .bub:first-child:not(:last-child) { border-radius: 16px 16px 14px 6px; }
.cluster .bub:not(:first-child):not(:last-child) { border-radius: 6px 14px 14px 6px; }
.cluster .bub:last-child:not(:first-child) { border-radius: 6px 14px 16px 16px; }
.bub .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--ink-soft); font-size: 16px; line-height: 1; padding: 2px 4px; }
.bub .x:hover { color: var(--accent-deep); }
.bub.mine .top { padding-right: 18px; }
.bub .cf { margin-top: 6px; font-size: 13px; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
.bub .cf button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; font-size: 13px; padding: 1px 9px; color: var(--ink); line-height: 1.4; }
.bub .cf button.yes { border-color: var(--accent-deep); color: var(--accent-deep); }
.more { align-self: flex-start; }
.more button { background: none; border: 0; color: var(--ink-soft); font-size: 14px; text-decoration: underline; padding: 0 2px; }

/* ----- finish sheet ----- */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 0 max(12px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px)); }
.sheet { background: var(--paper); border-radius: 20px; padding: 20px 18px; width: 100%; max-width: 520px; max-height: calc(100% - 24px); overflow: auto; }
.sheet h3 { font-weight: 400; font-size: 26px; margin: 0 0 2px; line-height: 1.2; }
.sheet .sum { color: var(--ink-soft); font-size: 16px; margin-bottom: 14px; }
.sheet .sum b { font-weight: 400; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 11px; font-size: 15px; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on { border-color: var(--accent-deep); background: var(--accent); color: var(--accent-ink); }
.sheet .again { text-align: center; margin-top: 10px; }
.sheet .again button { background: none; border: 0; color: var(--ink-soft); font-size: 15px; text-decoration: underline; }
.sheet .err { color: var(--accent-deep); font-size: 15px; margin-bottom: 8px; }

@media (prefers-reduced-motion: reduce) { .sprite.reading .body, .sprite.reading .book, .sprite.reading .dots, .sprite .lamp { animation: none; } }
</style>

</head>

<div class="app" id="app"></div>

<!-- 캐릭터 8종: 전신 라인 드로잉 -->

  <defs>
    <!-- 공통: 굵기 3.4, 둥근 끝, 콩 모양 몸통. 표정은 동물마다 다르게 -->
    <symbol id="c-bear" viewBox="0 0 100 110"><!-- 곰: 기분 좋게 감은 눈 -->
      <g fill="var(--paper)" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="31" cy="25" r="8"/><circle cx="69" cy="25" r="8"/>
        <path d="M25 42 a25 25 0 0 1 50 0 v34 a25 25 0 0 1 -50 0 z"/>

      <g fill="var(--paper)" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">

    <symbol id="c-dino" viewBox="0 0 100 110"><!-- 공룡: 신나서 벌린 입 -->

    </symbol>
    <symbol id="c-pig" viewBox="0 0 100 110"><!-- 돼지: 윙크 -->
      <g fill="var(--paper)" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M82 60 q7 -6 2 -11 q-4 -3 -5 2" fill="none"/>
        <path d="M31 40 q-6 -10 -2 -15 q6 2 13 8 z"/><path d="M69 40 q6 -10 2 -15 q-6 2 -13 8 z"/>
        <ellipse cx="50" cy="62" rx="31" ry="28"/>
        <ellipse cx="50" cy="64" rx="9" ry="6.5"/>
        <ellipse cx="38" cy="92" rx="8" ry="3.6"/><ellipse cx="62" cy="92" rx="8" ry="3.6"/>
      </g>
      <g fill="currentColor"><circle cx="37" cy="52" r="2.4"/><circle cx="46.5" cy="64" r="1.5"/><circle cx="53.5" cy="64" r="1.5"/></g>
      <path d="M59 52 q4 -5 8 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="c-hedgehog" viewBox="0 0 100 110"><!-- 고슴도치: 실눈 웃음 -->
      <g fill="var(--paper)" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 64 L22 50 L32 54 L34 40 L44 48 L50 34 L58 46 L68 38 L70 52 L82 48 L80 62 L88 66 L80 72 L84 84 Q66 94 50 92 Q34 92 24 84 Z"/>
        <ellipse cx="50" cy="70" rx="26" ry="20"/>
        <path d="M24 70 q-9 0 -13 6 q5 5 13 4" />

function makeSupabaseStore(sb, uid) {

    const { data, error } = await sb.from('rr_readers').select('*');
    if (error) { console.error(error); return; }

  }
  async function loadSessions() {
    const { data, error } = await sb.from('rr_sessions').select('*').order('ended_at', { ascending: false }).limit(2000);
    if (error) { console.error(error); return; }

    for (const [id, cb] of sessCbs) cb(sessionsCache.filter(x => x.readerId === id));
  }

    .on('postgres_changes', { event: '*', schema: 'public', table: 'rr_readers' }, () => loadReaders())

    .subscribe();

    kind: 'supabase',
    async readerExists(id) { const { data, error } = await sb.from('rr_readers').select('id').eq('id', id).maybeSingle(); if (error) throw error; return !!data; },
    subscribeReaders(cb) { readerCbs.push(cb); loadReaders(); return () => {}; },
    subscribeSessions(id, cb) { sessCbs.set(id, cb); cb(sessionsCache.filter(x => x.readerId === id)); if (sessCbs.size === 1) loadSessions(); return () => sessCbs.delete(id); },
    async setReader(d) {

    },
    async updateReader(p) {

}
function myReader() { return S.readers.get(S.me); }

function saveProfile() {
  const nick = ($('#nick')?.value || '').trim();
  if (!S.setupAnimal || !nick) return;
  const prev = myReader() || {};
  act(async () => {
    await store.setReader({ animal: S.setupAnimal, nickname: nick.slice(0, 20), status: prev.status || 'idle',
      accum: prev.accum || 0, startedAt: prev.startedAt || null, sessionStartedAt: prev.sessionStartedAt || null, updatedAt: Date.now() });

  const title = ($('#s-title')?.value || m.title || '').trim().slice(0, 80);
  if (!title) { m.err = '책 제목을 적어 주세요.'; render(); return; }
  const note = ($('#s-note')?.value || m.note || '').trim().slice(0, 300);
  m.saving = true; m.err = ''; render();
  act(async () => {
    try {
      await store.addSession({ startedAt: m.startedAt, endedAt: m.endedAt, seconds: m.seconds, title, note });
      await store.updateReader({ status: 'idle', accum: 0, startedAt: null, sessionStartedAt: null, updatedAt: Date.now() });
      S.modal = null;
      render();
    } catch (e) { m.saving = false; throw e; }
  });
}
function cancelStop() { S.modal = null; render(); }
function deleteSession(id) {
  const mine = (S.sessions.get(S.me) || []).find(x => x.id === id);
  if (!mine) return;
  S.confirmDel = null;

const CHAT_MAX = 200;
function pushChat(m) {
  S.chat.msgs = [...S.chat.msgs.filter(x => x.id !== m.id), m].slice(-CHAT_MAX);
  if (S.phase === 'app' && S.tab === 'now') render();
}
async function sendChat() {
  const inp = $('#chat-input'); const text = (inp?.value || '').trim().slice(0, 120);
  if (!text) return;
  const m = { id: S.me + '-' + Date.now(), uid: S.me, text };
  if (inp) inp.value = '';
  if (roomCh) {
    try { await roomCh.send({ type: 'broadcast', event: 'chat', payload: m }); }
    catch (e) { console.error(e); pushChat({ ...m, at: Date.now() }); }
  } else pushChat({ ...m, at: Date.now() });
  setTimeout(() => $('#chat-input')?.focus(), 30);
}
async function adoptCode() {
  const code = (S.handoff.code || '').trim().toLowerCase().replace(/^u_/, '');
  if (!code) { S.handoff.err = '코드를 넣어 주세요.'; render(); return; }
  S.handoff.busy = true; S.handoff.err = ''; render();
  try {
    const ok = await store.readerExists('u_' + code);
    if (!ok) { S.handoff.busy = false; S.handoff.err = '이 코드로 된 캐릭터를 찾지 못했어요. 다시 확인해 주세요.'; render(); return; }
    try { localStorage.setItem('rr.uid', 'u_' + code); } catch (e) {}
    location.reload();
  } catch (e) { console.error(e); S.handoff.busy = false; S.handoff.err = '확인하지 못했어요. 잠시 후 다시 시도해 주세요.'; render(); }
}

// ---------- wandering ----------
function walkerFor(id, room) {
  let w = walkers.get(id);
  if (!w) {
    const W = Math.max(1, room.clientWidth - SPRITE_W), H = Math.max(1, room.clientHeight - SPRITE_H);
    w = { x: hash(id) * W, y: hash(id + 'y') * H, tx: 0, ty: 0, wait: 0.5 + hash(id + 'w') * 2, face: 1, speed: 14 + hash(id + 's') * 10, moving: false };
    w.tx = w.x; w.ty = w.y;
    walkers.set(id, w);
  }
  return w;
}
function newTarget(w, W, H, others) {
  for (let i = 0; i < 8; i++) {
    const tx = Math.random() * W, ty = Math.random() * H;
    const d = Math.hypot(tx - w.x, ty - w.y);
    if (d < 60) continue;
    if (others.some(o => Math.hypot(o.x - tx, o.y - ty) < 90)) continue;
    w.tx = tx; w.ty = ty; return;
  }
  w.tx = Math.random() * W; w.ty = Math.random() * H;
}
let lastTs = 0;
function step(ts) {
  requestAnimationFrame(step);
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0); lastTs = ts;
  const room = $('#room'); if (!room) return;
  const W = Math.max(1, room.clientWidth - SPRITE_W), H = Math.max(1, room.clientHeight - SPRITE_H);
  const els = room.querySelectorAll('.sprite');
  const all = [...els].map(el => walkerFor(el.dataset.uid, room));
  els.forEach((el, i) => {
    const id = el.dataset.uid, w = all[i], r = S.readers.get(id);
    w.x = Math.min(w.x, W); w.y = Math.min(w.y, H); w.tx = Math.min(w.tx, W); w.ty = Math.min(w.ty, H);
    const canWalk = !REDUCED && r && (r.status || 'idle') === 'idle' && (id !== S.me || !S.modal) && isHere(id);
    w.moving = false;
    if (canWalk) {
      const dx = w.tx - w.x, dy = w.ty - w.y, d = Math.hypot(dx, dy);
      if (d < 1.5) {
        w.wait -= dt;
        if (w.wait <= 0) { newTarget(w, W, H, all.filter(o => o !== w)); w.wait = 2 + Math.random() * 6; }
      } else {
        const stepLen = Math.min(d, w.speed * dt);
        w.x += dx / d * stepLen; w.y += dy / d * stepLen; w.moving = true;
        if (Math.abs(dx) > 2) w.face = dx < 0 ? -1 : 1;
      }
    } else { w.tx = w.x; w.ty = w.y; }
    el.style.transform = `translate(${w.x.toFixed(1)}px, ${w.y.toFixed(1)}px)`;
    el.style.setProperty('--face', w.face);
    el.style.setProperty('--bob', w.moving ? `${(Math.sin(ts / 110) * 1.8).toFixed(2)}px` : '0px');
  });
}

  const active = document.activeElement;
  const keep = active && active.id && app.contains(active) && 'value' in active
    ? { id: active.id, value: active.value, s: active.selectionStart, e: active.selectionEnd } : null;
  let body = '';
  if (S.phase === 'loading') body = `<div class="empty"><b>방에 들어가는 중</b>잠시만요.</div>`;
  else if (S.phase === 'setup') body = renderSetup();
  else body = S.tab === 'now' ? renderRoom() : renderLog();
  document.body.classList.toggle('scroll', !(S.phase === 'app' && S.tab === 'now'));
  app.innerHTML = `
    <header class="top">
      <div class="brand">같이 읽는 방 ${S.phase === 'app' && S.roomOk && S.online.size > 0 ? `<small>${S.online.size}명 접속 중</small>` : ''}</div>
      ${S.phase === 'app' ? `<div class="icons" role="tablist">

        <button class="iconbtn" role="tab" data-tab="log" aria-selected="${S.tab === 'log'}" title="기록" aria-label="기록">${ICON.log}</button>

    </header>
    ${S.storeNote ? `<div class="notice">${esc(S.storeNote)}</div>` : ''}
    ${body}

  bind();
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el && 'value' in el) {
      el.value = keep.value;
      el.focus({ preventScroll: true });
      try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {}
    }
  }
}

function isHere(id) { return !S.roomOk || id === S.me || S.online.has(id); }
function visibleReaders() {
  const out = [];
  for (const [id, r] of S.readers) out.push([id, r, isHere(id)]);
  // online first, then by name, so the order is stable
  out.sort((a, b) => (b[2] - a[2]) || String(a[1].nickname).localeCompare(String(b[1].nickname), 'ko'));
  return out;
}
function renderRoom() {
  const list = visibleReaders();
  const sprites = list.map(([id, r, here]) => {
    const mine = id === S.me;
    const st = r.status || 'idle';
    return `<div class="sprite ${st === 'reading' ? 'reading' : ''} ${here ? 'online' : 'offline'}" data-uid="${esc(id)}">
      ${here ? `<span class="lamp" title="접속 중" aria-label="접속 중"></span>` : ''}
      ${mine && st === 'idle' && !guideDone() ? `<button type="button" class="guide" id="guide">📕를 탭하면 읽기 시작!<br><small>다 읽으면 📖를 한 번 더</small></button>` : ''}

  }).join('');
  const my = myReader();
  const foot = '';
  const stack = S.chat.msgs.length ? `<div class="chat-box" id="chat-box" aria-live="polite">${S.chat.msgs.map(m => {
    const who = S.readers.get(m.uid)?.nickname || '누군가';
    const d = new Date(m.at);
    return `<div class="msg ${m.uid === S.me ? 'mine' : ''}"><b>${esc(who)}</b><span>${esc(m.text)}</span><time>${pad(d.getHours())}:${pad(d.getMinutes())}</time></div>`; }).join('')}</div>` : '';
  const chat = S.chat.open
    ? `<form class="chat-bar" id="chat-form"><input id="chat-input" maxlength="120" placeholder="메시지 보내기" autocomplete="off" enterkeyhint="send"><button type="submit" class="send" aria-label="보내기">${ICON.send}</button><button type="button" class="close" id="chat-close" aria-label="닫기">✕</button></form>`
    : `<button type="button" class="chat-fab" id="chat-open" aria-label="메시지 보내기">${ICON.chat}</button>`;
  return `<div class="room" id="room">${sprites}${stack}${foot && !S.chat.open ? `<div class="room-foot">${foot}</div>` : ''}</div>${chat}`;
}
function groupBooks(list) {
  const groups = new Map();
  for (const sess of list) {
    const key = (sess.title || '').trim().toLowerCase() || '\u0000';
    if (!groups.has(key)) groups.set(key, { title: (sess.title || '').trim(), items: [], seconds: 0, latest: 0 });
    const g = groups.get(key);
    g.items.push(sess); g.seconds += sess.seconds || 0; g.latest = Math.max(g.latest, sess.endedAt || 0);
  }
  const out = [...groups.values()];
  out.sort((a, b) => b.latest - a.latest);
  for (const g of out) g.items.sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));
  return out;
}
function bubble(sess, mine, withTitle) {
  const confirming = S.confirmDel === sess.id;
  const hasBody = !!sess.note;
  return `<div class="bub ${mine ? 'mine' : ''}">
    ${withTitle ? `<div class="top"><div class="t ${sess.title ? '' : 'un'}">${sess.title ? esc(sess.title) : '제목 없음'}</div></div>` : ''}
    ${sess.note ? `<div class="note">${esc(sess.note)}</div>` : ''}
    ${!hasBody && !withTitle ? `<div class="blank">소감 없이 읽음</div>` : ''}
    ${mine && !confirming ? `<button type="button" class="x" data-del="${esc(sess.id)}" aria-label="이 기록 지우기">×</button>` : ''}
    ${confirming ? `<div class="cf">이 기록을 지울까요? <button type="button" class="yes" data-del-yes="${esc(sess.id)}">네</button><button type="button" data-del-no="1">아니오</button></div>` : ''}
  </div>`;
}
function renderLog() {
  const ids = [...S.readers.keys()].sort((a, b) => (a === S.me ? -1 : b === S.me ? 1 : 0));
  if (!ids.length) return `<div class="empty"><b>아직 기록이 없어요</b>지금 화면에서 읽기를 시작해 보세요.</div>`;
  return `<section class="log">${ids.map(id => {
    const r = S.readers.get(id);
    const list = S.sessions.get(id) || [];
    const total = list.reduce((a, s) => a + (s.seconds || 0), 0);
    const mine = id === S.me;
    const open = S.expanded.has(id);
    let body = '';
    if (!list.length) body = '';
    else if (!open) {
      body = bubble(list[0], mine, true) + (list.length > 1 ? `<div class="more"><button data-expand="${esc(id)}">더보기 (${list.length - 1})</button></div>` : '');
    } else {
      body = groupBooks(list).map(g => `<div class="cluster">${g.items.map((sess, i) => bubble(sess, mine, i === 0)).join('')}</div>`).join('')
        + `<div class="more"><button data-expand="${esc(id)}">접기</button></div>`;
    }
    return `<article class="rec">
      <div class="av">${charSvg(r.animal)}</div>
      <div class="col">
        <div class="who"><div class="n">${esc(r.nickname || '이름 없음')}${mine ? '<small>나</small>' : ''}</div>${total ? `<div class="tot">${fmtDur(total)}</div>` : ''}</div>
        ${body}
      </div>
    </article>`;
  }).join('')}</section>`;
}
function recentTitles() {
  const seen = new Set(), out = [];
  for (const sess of S.sessions.get(S.me) || []) {
    const t = (sess.title || '').trim(); const k = t.toLowerCase();
    if (!t || seen.has(k)) continue;
    seen.add(k); out.push(t);
    if (out.length >= 8) break;
  }
  return out;
}

function tick() {
  if (S.phase !== 'app' || S.tab !== 'now') return;
  const now = Date.now();
  document.querySelectorAll('[data-timer]').forEach(el => {
    const r = S.readers.get(el.dataset.timer);
    if (!r || r.status === 'idle') return;
    el.textContent = fmtClock(elapsedOf(r, now));
  });
}

boot();
})();
</script>
